name: CodeRev
description: Self-hosted PR review that runs a cheap model behind a refutation panel.
author: tsouth89

inputs:
  pr:
    description: Pull request number to review. Defaults to the one that triggered the workflow.
    required: false
    default: ${{ github.event.pull_request.number }}
  api-key:
    description: Model API key. Pass a secret, never a literal.
    required: true
  provider:
    description: deepseek (default), openrouter, or openai.
    required: false
    default: deepseek
  model:
    description: Overrides the provider's default model.
    required: false
    default: ""
  base-url:
    description: Overrides the base URL for any OpenAI-compatible endpoint.
    required: false
    default: ""
  conventions:
    description: Path to a conventions file to include in the prompt, for example AGENTS.md.
    required: false
    default: ""
  post:
    description: Post the review as a PR comment. Set false to print it to the log only.
    required: false
    default: "true"
  github-token:
    description: Token used for reading the diff and posting the comment.
    required: false
    default: ${{ github.token }}
  find2-provider:
    description: Second generator's provider (dual-generator mode). Empty disables it.
    required: false
    default: ""
  find2-model:
    description: Second generator's model. Empty uses the provider's default.
    required: false
    default: ""
  find2-api-key:
    description: Second generator's API key. Empty degrades to single-generator with a warning.
    required: false
    default: ""
  refute-provider:
    description: Route the refutation panel to a different provider (e.g. a non-reasoning model whose votes cost a fraction). Empty keeps the generator's provider.
    required: false
    default: ""
  refute-model:
    description: Panel model when refute-provider is set.
    required: false
    default: ""
  refute-api-key:
    description: Panel provider's API key. Empty disables the panel override.
    required: false
    default: ""
  gate:
    description: >-
      Fail the check (exit 3) when a surviving finding meets this severity
      (high, medium, or low). Fail-open on provider/infra errors. Empty keeps
      the check advisory. Pair with removing continue-on-error in the workflow.
    required: false
    default: ""


runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REVIEW_API_KEY: ${{ inputs.api-key }}
        REVIEW_PROVIDER: ${{ inputs.provider }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_API_BASE_URL: ${{ inputs.base-url }}
        REVIEW_FIND2_PROVIDER: ${{ inputs.find2-api-key != '' && inputs.find2-provider || '' }}
        REVIEW_FIND2_MODEL: ${{ inputs.find2-api-key != '' && inputs.find2-model || '' }}
        REVIEW_FIND2_API_KEY: ${{ inputs.find2-api-key }}
        REVIEW_REFUTE_PROVIDER: ${{ inputs.refute-api-key != '' && inputs.refute-provider || '' }}
        REVIEW_REFUTE_MODEL: ${{ inputs.refute-api-key != '' && inputs.refute-model || '' }}
        REVIEW_REFUTE_API_KEY: ${{ inputs.refute-api-key }}
      run: |
        args=(--pr "${{ inputs.pr }}")
        [[ "${{ inputs.post }}" == "true" ]] && args+=(--post)
        [[ -n "${{ inputs.gate }}" ]] && args+=(--gate "${{ inputs.gate }}")
        [[ -n "${{ inputs.conventions }}" ]] && args+=(--conventions "${{ inputs.conventions }}")
        node "${{ github.action_path }}/bin/review-pr.ts" "${args[@]}"
